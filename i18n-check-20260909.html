<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico i18n Movida SST</title>
<style>
body{font-family:Arial,sans-serif;background:#f8fafc;color:#00205b;margin:0;padding:24px}.box{max-width:720px;margin:auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}select{font-size:18px;padding:12px;border-radius:12px;border:1px solid #007b85}h1{margin-top:18px}code{background:#f1f5f9;padding:4px 8px;border-radius:8px}.ok{color:#70ad47;font-weight:700}
</style>
</head>
<body>
<div class="box">
<div class="ok">VERSION: I18N-CHECK-20260909-1635</div>
<label for="lang">Idioma:</label>
<select id="lang">
<option value="es">Español</option>
<option value="en">English</option>
<option value="pt">Português</option>
<option value="fr">Français</option>
</select>
<h1 id="title">Datos Personales</h1>
<p id="text">Completa tu registro para formar parte de la red internacional.</p>
<p>Idioma activo: <code id="active">es</code></p>
</div>
<script>
(function(){
 const data={
  es:{title:'Datos Personales',text:'Completa tu registro para formar parte de la red internacional.'},
  en:{title:'Personal Information',text:'Complete your registration to join the international network.'},
  pt:{title:'Dados Pessoais',text:'Complete seu registro para fazer parte da rede internacional.'},
  fr:{title:'Données personnelles',text:'Complétez votre inscription pour rejoindre le réseau international.'}
 };
 const sel=document.getElementById('lang'),title=document.getElementById('title'),text=document.getElementById('text'),active=document.getElementById('active');
 function apply(lang){ const d=data[lang]||data.es; title.textContent=d.title; text.textContent=d.text; active.textContent=lang; document.documentElement.lang=lang==='pt'?'pt-BR':lang; }
 sel.addEventListener('change',e=>apply(e.target.value));
 apply('es');
})();
</script>
</body>
</html>
