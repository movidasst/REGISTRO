name: Promote corporate offer at top

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add visible corporate header action
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          if 'id="corporateHeaderBtn"' not in t:
              anchor='        <!-- Botón Directorio de Profesionales -->\n        <a href="https://directorio.movidasst.com"'
              if anchor not in t: raise SystemExit('directory button anchor not found')
              replacement='''        <div class="flex shrink-0 items-center gap-2">\n            <a id="corporateHeaderBtn" href="https://presupuesto.movidasst.com/" class="flex items-center gap-1.5 rounded-xl bg-gradient-to-r from-movida-blue to-movida-teal px-2.5 py-2 text-[0.68rem] font-black text-white shadow-md shadow-cyan-900/10 transition active:scale-95 sm:px-3.5 sm:text-xs">\n                <i class="fa-solid fa-building"></i>\n                <span>Empresas</span>\n            </a>\n\n            <!-- Botón Directorio de Profesionales -->\n            <a href="https://directorio.movidasst.com"'''
              t=t.replace(anchor,replacement,1)
              close='        </a>\n    </header>'
              if close not in t: raise SystemExit('header close anchor not found')
              t=t.replace(close,'        </a>\n        </div>\n    </header>',1)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'id="corporateHeaderBtn"' index.html
          grep -q 'https://presupuesto.movidasst.com/' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: surface corporate offer in fixed header"
          git push
