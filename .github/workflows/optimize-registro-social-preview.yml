name: Optimize Registro SST social preview
on:
  push:
    paths:
      - '.github/workflows/optimize-registro-social-preview.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Compress WhatsApp preview
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          from io import BytesIO
          src = Path('og-registro-movida-20261021.png')
          dst = Path('og-registro-movida-20261021-optimizado.jpg')
          if not src.is_file(): raise RuntimeError('Original OG image missing')
          with Image.open(src) as original:
              print('Original:', original.size, 'bytes:', src.stat().st_size)
              picture = ImageOps.fit(original.convert('RGB'), (1200,630), method=Image.Resampling.LANCZOS)
          maximum = 340 * 1024
          for quality in [88, 85, 82, 79, 76, 73, 70, 66, 62, 58]:
              stream = BytesIO()
              picture.save(stream, format='JPEG', quality=quality, optimize=True, progressive=True, subsampling=2)
              if stream.tell() <= maximum:
                  dst.write_bytes(stream.getvalue())
                  break
          else:
              raise RuntimeError('Could not optimize OG image below maximum size')
          with Image.open(dst) as check:
              check.verify()
          print('Preview ready:', dst, 'bytes:', dst.stat().st_size, 'quality:', quality)
          assert dst.stat().st_size <= maximum
          PY
      - name: Add optimized preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-registro-movida-20261021-optimizado.jpg
          git commit -m 'Optimize WhatsApp preview for Registro' || exit 0
          git push
