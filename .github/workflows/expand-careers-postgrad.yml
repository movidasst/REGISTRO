name: Expand careers and postgraduate options

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-careers-postgrad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Expand careers and postgraduate options
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          careers = [
              'TSU en Higiene y Seguridad Laboral',
              'Ingeniería en HSL',
              'Seguridad y Salud en el Trabajo',
              'Higiene Ocupacional',
              'Seguridad Industrial',
              'Prevención de Riesgos',
              'Ingeniería Industrial',
              'Ingeniería Ambiental',
              'Ingeniería Química',
              'Ingeniería Mecánica',
              'Ingeniería Eléctrica',
              'Ingeniería Civil',
              'Ingeniería de Producción',
              'Ingeniería de Procesos',
              'Enfermería',
              'Medicina',
              'Psicología',
              'Fisioterapia',
              'Terapia Ocupacional',
              'Derecho',
              'Recursos Humanos',
              'Gestión de Riesgos / Protección Civil',
              'Otra',
          ]

          tr = {
            'en': {
              'Seguridad y Salud en el Trabajo':'Occupational Safety and Health','Higiene Ocupacional':'Occupational Hygiene','Seguridad Industrial':'Industrial Safety','Prevención de Riesgos':'Risk Prevention','Ingeniería Industrial':'Industrial Engineering','Ingeniería Ambiental':'Environmental Engineering','Ingeniería Química':'Chemical Engineering','Ingeniería Mecánica':'Mechanical Engineering','Ingeniería Eléctrica':'Electrical Engineering','Ingeniería Civil':'Civil Engineering','Ingeniería de Producción':'Production Engineering','Ingeniería de Procesos':'Process Engineering','Enfermería':'Nursing','Medicina':'Medicine','Psicología':'Psychology','Fisioterapia':'Physiotherapy','Terapia Ocupacional':'Occupational Therapy','Derecho':'Law','Recursos Humanos':'Human Resources','Gestión de Riesgos / Protección Civil':'Risk Management / Civil Protection','Magíster':'Magister'
            },
            'pt': {
              'Seguridad y Salud en el Trabajo':'Segurança e Saúde no Trabalho','Higiene Ocupacional':'Higiene Ocupacional','Seguridad Industrial':'Segurança Industrial','Prevención de Riesgos':'Prevenção de Riscos','Ingeniería Industrial':'Engenharia Industrial','Ingeniería Ambiental':'Engenharia Ambiental','Ingeniería Química':'Engenharia Química','Ingeniería Mecánica':'Engenharia Mecânica','Ingeniería Eléctrica':'Engenharia Elétrica','Ingeniería Civil':'Engenharia Civil','Ingeniería de Producción':'Engenharia de Produção','Ingeniería de Procesos':'Engenharia de Processos','Enfermería':'Enfermagem','Medicina':'Medicina','Psicología':'Psicologia','Fisioterapia':'Fisioterapia','Terapia Ocupacional':'Terapia Ocupacional','Derecho':'Direito','Recursos Humanos':'Recursos Humanos','Gestión de Riesgos / Protección Civil':'Gestão de Riscos / Proteção Civil','Magíster':'Magister'
            },
            'fr': {
              'Seguridad y Salud en el Trabajo':'Santé et sécurité au travail','Higiene Ocupacional':'Hygiène du travail','Seguridad Industrial':'Sécurité industrielle','Prevención de Riesgos':'Prévention des risques','Ingeniería Industrial':'Génie industriel','Ingeniería Ambiental':'Génie environnemental','Ingeniería Química':'Génie chimique','Ingeniería Mecánica':'Génie mécanique','Ingeniería Eléctrica':'Génie électrique','Ingeniería Civil':'Génie civil','Ingeniería de Producción':'Génie de production','Ingeniería de Procesos':'Génie des procédés','Enfermería':'Sciences infirmières','Medicina':'Médecine','Psicología':'Psychologie','Fisioterapia':'Physiothérapie','Terapia Ocupacional':'Ergothérapie','Derecho':'Droit','Recursos Humanos':'Ressources humaines','Gestión de Riesgos / Protección Civil':'Gestion des risques / Protection civile','Magíster':'Magister'
            }
          }

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          pattern = re.compile(r'(?P<indent>\s*)<option value="TSU en Higiene y Seguridad Laboral">TSU en Higiene y Seguridad Laboral</option>\s*<option value="Ingeniería en HSL">Ingeniería en HSL</option>\s*<option value="Otra">Otra</option>')
          m = pattern.search(text)
          if not m:
              raise SystemExit('career option block not found')
          indent = m.group('indent').split('\n')[-1]
          block = '\n'.join(f'{indent}<option value="{c}">{c}</option>' for c in careers)
          text = text[:m.start()] + block + text[m.end():]

          if '<option value="Magíster">Magíster</option>' not in text:
              text, n = re.subn(r'(?P<indent>\s*)<option value="Maestría">Maestría</option>', lambda mm: mm.group(0) + '\n' + mm.group('indent').split('\n')[-1] + '<option value="Magíster">Magíster</option>', text, count=1)
              if n != 1:
                  raise SystemExit('postgraduate anchor not found')

          def add_translations(text):
              anchors = {
                'en': "      'Ingeniería en HSL': 'Engineering in Occupational Hygiene and Safety',\n",
                'pt': "      'Ingeniería en HSL': 'Engenharia em Higiene e Segurança do Trabalho',\n",
                'fr': "      'Ingeniería en HSL': 'Ingénierie en hygiène et sécurité au travail',\n",
              }
              maganchors = {
                'en': "      'Maestría': 'Master’s degree',\n",
                'pt': "      'Maestría': 'Mestrado',\n",
                'fr': "      'Maestría': 'Master',\n",
              }
              for lang in ('en','pt','fr'):
                  if "      'Enfermería':" not in text[text.find(anchors[lang]):text.find(anchors[lang])+2500]:
                      if anchors[lang] not in text:
                          raise SystemExit(f'{lang} career translation anchor missing')
                      additions = ''.join(f"      '{k}': '{v}',\n" for k,v in tr[lang].items() if k != 'Magíster')
                      text = text.replace(anchors[lang], anchors[lang] + additions, 1)
                  magline = f"      'Magíster': '{tr[lang]['Magíster']}',\n"
                  if magline not in text:
                      if maganchors[lang] not in text:
                          raise SystemExit(f'{lang} Magister translation anchor missing')
                      text = text.replace(maganchors[lang], maganchors[lang] + magline, 1)
              return text

          text = add_translations(text)
          index.write_text(text, encoding='utf-8')

          js = Path('i18n.js')
          jstext = add_translations(js.read_text(encoding='utf-8'))
          js.write_text(jstext, encoding='utf-8')
          PY

      - name: Validate changes
        run: |
          set -euxo pipefail
          for value in 'Enfermería' 'Psicología' 'Medicina' 'Derecho' 'Fisioterapia' 'Terapia Ocupacional' 'Ingeniería Industrial' 'Ingeniería Ambiental' 'Gestión de Riesgos / Protección Civil'; do
            grep -F "<option value=\"$value\">$value</option>" index.html
          done
          grep -F '<option value="Magíster">Magíster</option>' index.html
          grep -F "'Enfermería': 'Nursing'" index.html
          grep -F "'Enfermería': 'Enfermagem'" index.html
          grep -F "'Enfermería': 'Sciences infirmières'" index.html
          grep -F "registrar_integrante_internacional" index.html
          grep -F "upload_registration_photo" index.html
          grep -F "send_registration_email" index.html
          node --check i18n.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html i18n.js
          git commit -m 'Expand SST-related careers and add Magister option'
          git push origin main
