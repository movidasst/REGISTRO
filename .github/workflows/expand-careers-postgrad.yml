name: Expand careers and postgraduate options

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-careers-postgrad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Expand careers and postgraduate options
        run: |
          python - <<'PY'
          from pathlib import Path

          career_old = '''                                    <option value="TSU en Higiene y Seguridad Laboral">TSU en Higiene y Seguridad Laboral</option>
                                    <option value="Ingeniería en HSL">Ingeniería en HSL</option>
                                    <option value="Otra">Otra</option>'''

          career_new = '''                                    <option value="TSU en Higiene y Seguridad Laboral">TSU en Higiene y Seguridad Laboral</option>
                                    <option value="Ingeniería en HSL">Ingeniería en HSL</option>
                                    <option value="Seguridad y Salud en el Trabajo">Seguridad y Salud en el Trabajo</option>
                                    <option value="Higiene Ocupacional">Higiene Ocupacional</option>
                                    <option value="Seguridad Industrial">Seguridad Industrial</option>
                                    <option value="Prevención de Riesgos">Prevención de Riesgos</option>
                                    <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                                    <option value="Ingeniería Ambiental">Ingeniería Ambiental</option>
                                    <option value="Ingeniería Química">Ingeniería Química</option>
                                    <option value="Ingeniería Mecánica">Ingeniería Mecánica</option>
                                    <option value="Ingeniería Eléctrica">Ingeniería Eléctrica</option>
                                    <option value="Ingeniería Civil">Ingeniería Civil</option>
                                    <option value="Ingeniería de Producción">Ingeniería de Producción</option>
                                    <option value="Ingeniería de Procesos">Ingeniería de Procesos</option>
                                    <option value="Enfermería">Enfermería</option>
                                    <option value="Medicina">Medicina</option>
                                    <option value="Psicología">Psicología</option>
                                    <option value="Fisioterapia">Fisioterapia</option>
                                    <option value="Terapia Ocupacional">Terapia Ocupacional</option>
                                    <option value="Derecho">Derecho</option>
                                    <option value="Recursos Humanos">Recursos Humanos</option>
                                    <option value="Gestión de Riesgos / Protección Civil">Gestión de Riesgos / Protección Civil</option>
                                    <option value="Otra">Otra</option>'''

          translations = {
            "en": [
              ("      'Ingeniería en HSL': 'Engineering in Occupational Hygiene and Safety',\n", "      'Ingeniería en HSL': 'Engineering in Occupational Hygiene and Safety',\n      'Seguridad y Salud en el Trabajo': 'Occupational Safety and Health',\n      'Higiene Ocupacional': 'Occupational Hygiene',\n      'Seguridad Industrial': 'Industrial Safety',\n      'Prevención de Riesgos': 'Risk Prevention',\n      'Ingeniería Industrial': 'Industrial Engineering',\n      'Ingeniería Ambiental': 'Environmental Engineering',\n      'Ingeniería Química': 'Chemical Engineering',\n      'Ingeniería Mecánica': 'Mechanical Engineering',\n      'Ingeniería Eléctrica': 'Electrical Engineering',\n      'Ingeniería Civil': 'Civil Engineering',\n      'Ingeniería de Producción': 'Production Engineering',\n      'Ingeniería de Procesos': 'Process Engineering',\n      'Enfermería': 'Nursing',\n      'Medicina': 'Medicine',\n      'Psicología': 'Psychology',\n      'Fisioterapia': 'Physiotherapy',\n      'Terapia Ocupacional': 'Occupational Therapy',\n      'Derecho': 'Law',\n      'Recursos Humanos': 'Human Resources',\n      'Gestión de Riesgos / Protección Civil': 'Risk Management / Civil Protection',\n"),
              ("      'Maestría': 'Master’s degree',\n", "      'Maestría': 'Master’s degree',\n      'Magíster': 'Magister',\n"),
            ],
            "pt": [
              ("      'Ingeniería en HSL': 'Engenharia em Higiene e Segurança do Trabalho',\n", "      'Ingeniería en HSL': 'Engenharia em Higiene e Segurança do Trabalho',\n      'Seguridad y Salud en el Trabajo': 'Segurança e Saúde no Trabalho',\n      'Higiene Ocupacional': 'Higiene Ocupacional',\n      'Seguridad Industrial': 'Segurança Industrial',\n      'Prevención de Riesgos': 'Prevenção de Riscos',\n      'Ingeniería Industrial': 'Engenharia Industrial',\n      'Ingeniería Ambiental': 'Engenharia Ambiental',\n      'Ingeniería Química': 'Engenharia Química',\n      'Ingeniería Mecánica': 'Engenharia Mecânica',\n      'Ingeniería Eléctrica': 'Engenharia Elétrica',\n      'Ingeniería Civil': 'Engenharia Civil',\n      'Ingeniería de Producción': 'Engenharia de Produção',\n      'Ingeniería de Procesos': 'Engenharia de Processos',\n      'Enfermería': 'Enfermagem',\n      'Medicina': 'Medicina',\n      'Psicología': 'Psicologia',\n      'Fisioterapia': 'Fisioterapia',\n      'Terapia Ocupacional': 'Terapia Ocupacional',\n      'Derecho': 'Direito',\n      'Recursos Humanos': 'Recursos Humanos',\n      'Gestión de Riesgos / Protección Civil': 'Gestão de Riscos / Proteção Civil',\n"),
              ("      'Maestría': 'Mestrado',\n", "      'Maestría': 'Mestrado',\n      'Magíster': 'Magister',\n"),
            ],
            "fr": [
              ("      'Ingeniería en HSL': 'Ingénierie en hygiène et sécurité au travail',\n", "      'Ingeniería en HSL': 'Ingénierie en hygiène et sécurité au travail',\n      'Seguridad y Salud en el Trabajo': 'Santé et sécurité au travail',\n      'Higiene Ocupacional': 'Hygiène du travail',\n      'Seguridad Industrial': 'Sécurité industrielle',\n      'Prevención de Riesgos': 'Prévention des risques',\n      'Ingeniería Industrial': 'Génie industriel',\n      'Ingeniería Ambiental': 'Génie environnemental',\n      'Ingeniería Química': 'Génie chimique',\n      'Ingeniería Mecánica': 'Génie mécanique',\n      'Ingeniería Eléctrica': 'Génie électrique',\n      'Ingeniería Civil': 'Génie civil',\n      'Ingeniería de Producción': 'Génie de production',\n      'Ingeniería de Procesos': 'Génie des procédés',\n      'Enfermería': 'Sciences infirmières',\n      'Medicina': 'Médecine',\n      'Psicología': 'Psychologie',\n      'Fisioterapia': 'Physiothérapie',\n      'Terapia Ocupacional': 'Ergothérapie',\n      'Derecho': 'Droit',\n      'Recursos Humanos': 'Ressources humaines',\n      'Gestión de Riesgos / Protección Civil': 'Gestion des risques / Protection civile',\n"),
              ("      'Maestría': 'Master',\n", "      'Maestría': 'Master',\n      'Magíster': 'Magister',\n"),
            ],
          }

          for fname in ['index.html', 'i18n.js']:
              path = Path(fname)
              text = path.read_text(encoding='utf-8')

              if fname == 'index.html':
                  if career_old not in text:
                      raise SystemExit('career option block not found')
                  text = text.replace(career_old, career_new, 1)
                  post_old = '                                    <option value="Maestría">Maestría</option>\n'
                  post_new = post_old + '                                    <option value="Magíster">Magíster</option>\n'
                  if post_old not in text:
                      raise SystemExit('postgraduate option anchor not found')
                  text = text.replace(post_old, post_new, 1)

              for lang, reps in translations.items():
                  for old, new in reps:
                      if old not in text:
                          raise SystemExit(f'{fname}: translation anchor missing for {lang}: {old.strip()}')
                      text = text.replace(old, new, 1)

              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate changes
        run: |
          set -euxo pipefail
          grep -F '<option value="Enfermería">Enfermería</option>' index.html
          grep -F '<option value="Psicología">Psicología</option>' index.html
          grep -F '<option value="Medicina">Medicina</option>' index.html
          grep -F '<option value="Derecho">Derecho</option>' index.html
          grep -F '<option value="Fisioterapia">Fisioterapia</option>' index.html
          grep -F '<option value="Magíster">Magíster</option>' index.html
          grep -F "'Enfermería': 'Nursing'" index.html
          grep -F "'Enfermería': 'Enfermagem'" index.html
          grep -F "'Enfermería': 'Sciences infirmières'" index.html
          grep -F "registrar_integrante_internacional" index.html
          grep -F "upload_registration_photo" index.html
          grep -F "send_registration_email" index.html
          node --check i18n.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html i18n.js
          git commit -m 'Expand SST-related careers and add Magister option'
          git push origin main
