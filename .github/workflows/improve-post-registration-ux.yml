name: Improve post-registration WhatsApp and processing UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-post-registration-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply registration UX patch
        run: python tools/patch_post_registration_ux.py

      - name: Validate JavaScript and diff
        run: |
          node --check i18n.js
          git diff --check
          grep -F 'id="processingMsg"' index.html
          grep -F 'id="successWhatsappStatesGroup"' index.html
          grep -F 'https://chat.whatsapp.com/E3A0nzbY4TkE6WXsPI10nW' index.html
          grep -F 'Grupo de Estudio Venezuela' index.html

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html i18n.js
          git commit -m 'Improve registration processing feedback and Venezuela groups'
          git push origin main
