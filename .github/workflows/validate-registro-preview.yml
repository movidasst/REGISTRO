name: Validate Registro WhatsApp preview
on:
  push:
    paths:
      - '.github/workflows/validate-registro-preview.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check public social preview
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://registro.movidasst.com/'
          IMAGE='https://registro.movidasst.com/og-registro-movida-20261021-optimizado.jpg'
          for attempt in $(seq 1 12); do
            curl --fail --location --silent --show-error --max-time 20 -A 'WhatsApp/2.26.21.10' "${PAGE}?verify_registro=20261021-${attempt}" -o /tmp/registro.html || true
            if grep -Fq "$IMAGE" /tmp/registro.html 2>/dev/null; then
              echo "OG metadata visible on public site; attempt ${attempt}"
              break
            fi
            echo "Waiting for public site deployment: attempt ${attempt}"
            sleep 7
          done
          grep -F "og:image" /tmp/registro.html | head -n 4
          grep -Fq "$IMAGE" /tmp/registro.html
          curl --fail --location --silent --show-error --max-time 25 -A 'WhatsApp/2.26.21.10' -D /tmp/registro-headers.txt "$IMAGE" -o /tmp/registro-preview.jpg
          grep -Ei '^HTTP/|^content-type:|^content-length:|^cache-control:' /tmp/registro-headers.txt | tail -n 10
          file /tmp/registro-preview.jpg
          SIZE=$(stat -c%s /tmp/registro-preview.jpg)
          echo "Image downloaded via WhatsApp-style request: ${SIZE} bytes"
          test "$SIZE" -gt 10000
          test "$SIZE" -lt 350000
          file --mime-type /tmp/registro-preview.jpg | grep -q 'image/jpeg'
