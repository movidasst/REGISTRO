name: Live browser i18n smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-browser-i18n-smoke.yml'
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core@24
      - name: Test direct language URLs on desktop and mobile
        run: |
          cat > smoke.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox','--disable-dev-shm-usage']});
          const viewports=[
            {name:'desktop',value:{width:1440,height:900}},
            {name:'mobile',value:{width:390,height:844,isMobile:true,hasTouch:true}}
          ];
          const languages=[
            {lang:'en', expected:'Personal Information'},
            {lang:'pt', expected:'Dados Pessoais'},
            {lang:'fr', expected:'Données personnelles'},
            {lang:'es', expected:'Datos Personales'}
          ];
          let failed=false;
          for (const vp of viewports) {
            for (const item of languages) {
              const page=await browser.newPage();
              await page.setViewport(vp.value);
              const logs=[];
              page.on('pageerror',e=>logs.push(`pageerror:${e.message}`));
              const url=`https://registro.movidasst.com/?lang=${item.lang}&v=20260909-1705&smoke=${Date.now()}`;
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('#languageLinks',{timeout:15000});
              await new Promise(r=>setTimeout(r,2500));
              const title=await page.$eval('#stepTitle',e=>e.textContent.trim());
              const active=await page.evaluate(()=>window.movidaI18n?.currentLang?.());
              const current=await page.$$eval('[data-lang-link][aria-current="page"]',els=>els.map(e=>e.getAttribute('data-lang-link')));
              const selectExists=await page.$('#languageSelect')!==null;
              console.log(JSON.stringify({viewport:vp.name,url,title,active,current,selectExists,logs}));
              if(title!==item.expected||active!==item.lang||current.length!==1||current[0]!==item.lang||selectExists) failed=true;
              await page.close();
            }
          }
          await browser.close();
          if(failed) process.exit(1);
          EOF
          node smoke.mjs
